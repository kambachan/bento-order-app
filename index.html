<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>弁当発注システム</title>
<style>
  :root{
    --main:#f0913f; --main-dark:#cc7328; --bg:#ffffff; --card:#ffffff;
    --border:#ffe3c2; --text:#333; --sub:#948a7e; --ok:#3a8b4a; --lock:#b0453a;
  }
  *{box-sizing:border-box;}
  body{font-family:"Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;background:var(--bg);color:var(--text);margin:0;padding:0;}
  header{background:var(--main);color:#fff;padding:14px 20px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;}
  header h1{font-size:18px;margin:0;}
  header .clock{font-size:12px;opacity:.9;}
  nav{display:flex;background:#fff;border-bottom:1px solid var(--border);overflow-x:auto;}
  nav button{background:none;border:none;padding:12px 18px;font-size:14px;cursor:pointer;color:var(--sub);white-space:nowrap;border-bottom:3px solid transparent;}
  nav button.active{color:var(--main-dark);border-bottom:3px solid var(--main);font-weight:bold;}
  main{max-width:820px;margin:0 auto;padding:16px;}
  .card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:16px;margin-bottom:16px;}
  .card h2{font-size:16px;margin:0 0 12px;color:var(--main-dark);}
  label{display:block;font-size:13px;color:var(--sub);margin-bottom:4px;margin-top:10px;}
  select,input[type=date],input[type=text],input[type=number],input[type=time],input[type=file]{
    width:100%;padding:9px 10px;border:1px solid var(--border);border-radius:6px;font-size:14px;background:#fff;
  }
  .menu-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;margin-top:8px;}
  .menu-item{border:2px solid var(--border);border-radius:8px;padding:10px;text-align:center;cursor:pointer;background:#fff;}
  .menu-item.selected{border-color:var(--main);background:#fff1e0;}
  .menu-item .name{font-weight:bold;font-size:14px;}
  .menu-item .price{font-size:12px;color:var(--sub);margin-top:4px;}
  button.primary{background:var(--main);color:#fff;border:none;padding:11px 20px;border-radius:6px;font-size:15px;cursor:pointer;margin-top:14px;}
  button.primary:disabled{background:#ccc;cursor:not-allowed;}
  button.secondary{background:#fff;color:var(--main-dark);border:1px solid var(--main);padding:8px 14px;border-radius:6px;font-size:13px;cursor:pointer;}
  button.danger{background:#fff;color:var(--lock);border:1px solid var(--lock);padding:6px 10px;border-radius:6px;font-size:12px;cursor:pointer;}
  button.small{padding:6px 10px;font-size:12px;border-radius:6px;border:1px solid var(--border);background:#fff;cursor:pointer;}
  .status-box{padding:10px 12px;border-radius:6px;font-size:13px;margin-top:10px;}
  .status-ok{background:#eaf6ec;color:var(--ok);border:1px solid #c7e7cc;}
  .status-lock{background:#fbebe9;color:var(--lock);border:1px solid #f0c9c4;}
  table{width:100%;border-collapse:collapse;font-size:13px;margin-top:8px;}
  th,td{border:1px solid var(--border);padding:7px 8px;text-align:left;}
  th{background:#fff1e0;}
  .table-scroll{max-height:60vh;overflow-y:auto;overflow-x:auto;border:1px solid var(--border);border-radius:8px;margin-top:8px;}
  .table-scroll table{margin-top:0;}
  .table-scroll th{position:sticky;top:0;z-index:2;box-shadow:0 1px 0 var(--border);}
  @media print{ .table-scroll{max-height:none;overflow:visible;} .table-scroll th{position:static;} }
  .subtabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px;}
  .subtabs button{padding:7px 12px;font-size:13px;border:1px solid var(--border);background:#fff;border-radius:16px;cursor:pointer;color:var(--sub);}
  .subtabs button.active{background:var(--main);color:#fff;border-color:var(--main);}
  .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
  .row > *{flex:1;min-width:100px;}
  .hint{font-size:12px;color:var(--sub);margin-top:6px;}
  .checkbox-col{width:34px;text-align:center;}
  .checkbox-box{display:inline-block;width:16px;height:16px;border:1.5px solid #333;}
  .total-row{font-weight:bold;background:#fff1e0;}
  .row-holiday td{background:#eeeeee;color:#999;}
  .row-today td{background:#fff1e0;font-weight:bold;box-shadow:inset 0 2px 0 var(--main), inset 0 -2px 0 var(--main);}
  .row-today.row-holiday td{background:#e9e2da;}
  .today-badge{display:inline-block;background:var(--main);color:#fff;font-size:10px;font-weight:bold;padding:1px 6px;border-radius:10px;margin-left:6px;vertical-align:middle;}
  @media print{
    header, nav, .no-print{display:none !important;}
    body{background:#fff;}
    main{max-width:100%;padding:0;}
    .card{border:none;box-shadow:none;}
  }
</style>
</head>
<body>

<header>
  <h1>🍱 社内弁当発注システム</h1>
  <div class="clock" id="clockDisplay"></div>
</header>

<nav id="mainNav">
  <button data-tab="order" class="active">発注</button>

<main id="app"></main>

    ],

    ],
    deadline: {daysBefore:0, time:"09:00"}, // 発注日の(daysBefore)日前 time までに締切（デフォルト: 当日9:00締切）
    blockedDates: [], // 発注不可日（個別指定）例: ["2026-08-15"]
    orders: {} // { "YYYY-MM-DD": { employeeId: menuId } }
  };
}

function loadData(){
  const raw = localStorage.getItem(STORAGE_KEY);
  if(!raw) return defaultData();
  try{
    const d = JSON.parse(raw);
    // 後方互換のため不足フィールドを補完
    const def = defaultData();
    return Object.assign(def, d);
  }catch(e){ return defaultData(); }
}

function saveData(){ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }

let state = loadData();

/* ===================== ユーティリティ ===================== */
function uid(prefix){ return prefix + Math.random().toString(36).slice(2,9); }

function dayOfWeek(dateStr){
  return new Date(dateStr+"T00:00:00").getDay(); // 0:日 ... 6:土
}

function isBlockedDate(dateStr){
  return (state.blockedDates||[]).includes(dateStr);
}

function holidayName(dateStr){
  return HOLIDAYS[dateStr] || null;
}

function isNonOrderableDay(dateStr){
  return isBlockedDate(dateStr) || !!holidayName(dateStr);
}

function todayStr(){
  const d = new Date();
  return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
}

function fmtDateJP(dateStr){
  const d = new Date(dateStr+"T00:00:00");
  const days = ["日","月","火","水","木","金","土"];
  return `${d.getMonth()+1}月${d.getDate()}日(${days[d.getDay()]})`;
}

// 指定した発注対象日の締切日時を計算
function getDeadline(dateStr){
  const target = new Date(dateStr+"T00:00:00");
  target.setDate(target.getDate() - (state.deadline.daysBefore||0));
  const [hh,mm] = (state.deadline.time||"15:00").split(":").map(Number);
  target.setHours(hh, mm, 0, 0);
  return target;
}

function isLocked(dateStr){
  return new Date() > getDeadline(dateStr);
}

function fmtDeadline(dateStr){
  const dl = getDeadline(dateStr);
  return `${dl.getMonth()+1}/${dl.getDate()} ${String(dl.getHours()).padStart(2,"0")}:${String(dl.getMinutes()).padStart(2,"0")}`;
}

/* ===================== 画面共通 ===================== */
let currentTab = "order";
let currentAdminSub = "employees";

const app = document.getElementById("app");

document.getElementById("mainNav").addEventListener("click", (e)=>{
  if(e.target.tagName !== "BUTTON") return;
  currentTab = e.target.dataset.tab;
  [...document.getElementById("mainNav").children].forEach(b=>b.classList.toggle("active", b===e.target));
  render();
});

function render(){
  if(currentTab === "order") renderOrderTab();
  else renderAdminTab();
}

/* ===================== 発注タブ（社員向け） ===================== */
let loggedInEmployee = "";  // ログイン中の社員ID（社員CDで認証）
let loginError = "";
let calendarYearMonth = todayStr().slice(0,7); // "YYYY-MM"
let batchMessage = "";

function shiftMonth(ym, delta){
  let [y,m] = ym.split("-").map(Number);
  m += delta;
  while(m>12){ m-=12; y++; }
  while(m<1){ m+=12; y--; }
  return `${y}-${String(m).padStart(2,"0")}`;
}

function daysInMonth(ym){
  const [y,m] = ym.split("-").map(Number);
  const last = new Date(y, m, 0).getDate();
  return Array.from({length:last}, (_,i)=> `${y}-${String(m).padStart(2,"0")}-${String(i+1).padStart(2,"0")}`);
}

function renderOrderTab(){
  if(!loggedInEmployee){
    renderLoginScreen();
    return;
  }

  const emp = state.employees.find(x=>x.id===loggedInEmployee);
  if(!emp){ loggedInEmployee = ""; renderLoginScreen(); return; }

  const dates = daysInMonth(calendarYearMonth);
  const [ymYear, ymMonth] = calendarYearMonth.split("-");

      <div class="row" style="align-items:center;">
        <div>
          <div class="hint" style="margin:0;">ログイン中</div>
          <div style="font-size:16px;font-weight:bold;">${emp.name}（${emp.dept} / 社員CD: ${emp.code||"―"}）</div>
        </div>
        <button class="secondary" id="logoutBtn" style="flex:0 0 auto;">ログアウト（別の人が使う）</button>
      </div>
    </div>

    <div class="card no-print">
      <h2>対象月</h2>
      <div class="row" style="align-items:center;">
        <button class="secondary" id="prevMonthBtn" style="flex:0 0 auto;">← 前月</button>
        <input type="month" id="monthSelect" value="${calendarYearMonth}">
        <button class="secondary" id="nextMonthBtn" style="flex:0 0 auto;">次月 →</button>
      </div>
      <div class="hint">締切ルール: 対象日の${state.deadline.daysBefore}日前 ${state.deadline.time} まで</div>
    </div>

    <div class="card">
      <h2>${ymYear}年${Number(ymMonth)}月 一括発注</h2>
      <div class="table-scroll">
      <table>
        <tr>
          <th>日付</th><th>状態</th>
          ${state.menu.map(m=>`<th>${m.name}<br><span class="hint" style="margin:0;">¥${m.price}</span></th>`).join("")}
        </tr>
        ${dates.map(d=>{
          const holiday = holidayName(d);
          const blockedDate = isBlockedDate(d);
          const nonOrderable = blockedDate || !!holiday;
          const locked = isLocked(d);
          const existing = existingMenuFor(loggedInEmployee, d);
          const existingMenuName = existing ? (state.menu.find(m=>m.id===existing)?.name || "―") : null;
          const isToday = d === todayStr();
          const todayCls = isToday ? " row-today" : "";
          const todayMark = isToday ? ` <span class="today-badge">本日</span>` : "";
          const rowIdAttr = isToday ? ` id="rowToday"` : "";
          if(nonOrderable){
            const label = holiday ? holiday : "発注不可日";
            return `<tr class="row-holiday${todayCls}"${rowIdAttr}>
              <td>${fmtDateJP(d)}${todayMark}</td>
              <td><span style="color:var(--sub);">休（${label}）</span></td>
              <td colspan="${state.menu.length}">${existingMenuName ? existingMenuName : "発注不可"}</td>
            </tr>`;
          }
          if(locked){
            return `<tr class="${todayCls.trim()}"${rowIdAttr}>
              <td>${fmtDateJP(d)}${todayMark}</td>
              <td><span style="color:var(--lock);">締切済み</span></td>
              <td colspan="${state.menu.length}">${existingMenuName ? existingMenuName : "（発注なし）"}</td>
            </tr>`;
          }
          return `<tr class="${todayCls.trim()}"${rowIdAttr}>
            <td>${fmtDateJP(d)}${todayMark}</td>
            <td><span style="color:var(--ok);">受付中</span></td>
            ${state.menu.map(m=>`
              <td class="checkbox-col" style="width:auto;text-align:center;">
                <input type="checkbox" class="calCheckbox" data-date="${d}" data-menu="${m.id}" ${existing===m.id?"checked":""}>
              </td>`).join("")}
          </tr>`;
        }).join("")}
      </table>
      </div>
      <div class="hint">1日につき1つのメニューにチェックしてください（別のメニューにチェックすると自動的に切り替わります）。取り消す場合はチェックを外してください。</div>
      <button class="primary" id="batchOrderBtn">まとめて発注する</button>
      ${batchMessage ? `<div class="status-box status-ok">${batchMessage}</div>` : ""}
    </div>

    <div class="card">
      <h2>${ymYear}年${Number(ymMonth)}月の発注回数</h2>
      <div class="status-box status-ok">今月は ${dates.filter(d=>existingMenuFor(loggedInEmployee, d)).length} 回発注しています</div>
    </div>
  `;

  document.getElementById("logoutBtn").onclick = ()=>{
    loggedInEmployee = ""; loginError = ""; batchMessage = ""; render();
  };
  document.getElementById("monthSelect").onchange = (e)=>{
    if(e.target.value) calendarYearMonth = e.target.value;
    batchMessage=""; render();
  };
  document.getElementById("prevMonthBtn").onclick = ()=>{ calendarYearMonth = shiftMonth(calendarYearMonth, -1); batchMessage=""; render(); };
  document.getElementById("nextMonthBtn").onclick = ()=>{ calendarYearMonth = shiftMonth(calendarYearMonth, 1); batchMessage=""; render(); };

  // 今月を表示している場合、本日の行が見える位置まで自動スクロール
  if(calendarYearMonth === todayStr().slice(0,7)){
    const todayRow = document.getElementById("rowToday");
    if(todayRow && todayRow.scrollIntoView){
      todayRow.scrollIntoView({block:"center"});
    }
  }

  // 同じ日で他のメニューにチェックが入ったら、その日の他のチェックボックスは自動的に外す（1日1食）
  document.querySelectorAll(".calCheckbox").forEach(cb=>{
    cb.onchange = ()=>{
      if(cb.checked){
        document.querySelectorAll(`.calCheckbox[data-date="${cb.dataset.date}"]`).forEach(other=>{
          if(other !== cb) other.checked = false;
        });
      }
    };
  });

  document.getElementById("batchOrderBtn").onclick = placeBatchOrders;
}

  const trimmed = (code||"").trim();
  if(!trimmed){ loginError = "社員CDを入力してください"; return false; }
  const emp = state.employees.find(e=>e.code === trimmed);
  if(!emp){ loginError = "該当する社員CDが見つかりません"; return false; }
  loggedInEmployee = emp.id;
  loginError = "";
  return true;
}

function renderLoginScreen(){
  app.innerHTML = `
    <div class="card">
      <h2>社員CDでログイン</h2>
      <div class="hint">ここでログインすると、発注タブと管理タブ（管理者権限がある場合）の両方で共通して使用されます。</div>
      <label>社員CD</label>
      <input type="text" id="loginCode" placeholder="例: 1001" autocomplete="off" inputmode="numeric">
      ${loginError ? `<div class="status-box status-lock">${loginError}</div>` : ""}
      <button class="primary" id="loginBtn">ログイン</button>
    </div>
  `;
  const codeInput = document.getElementById("loginCode");
  const doLogin = ()=>{
    if(attemptLogin(codeInput.value)){ batchMessage = ""; }
    render();
  };
  document.getElementById("loginBtn").onclick = doLogin;
  codeInput.onkeydown = (e)=>{ if(e.key === "Enter") doLogin(); };
  codeInput.focus();
}

function existingMenuFor(empId, dateStr){
  return (state.orders[dateStr] && state.orders[dateStr][empId]) || null;
}

function placeBatchOrders(){
  let ordered = 0, cancelled = 0;
  daysInMonth(calendarYearMonth).forEach(d=>{
    if(isLocked(d) || isNonOrderableDay(d)) return; // 念のため締切済み・土日祝は無視
    const checked = document.querySelector(`.calCheckbox[data-date="${d}"]:checked`);
    const menuId = checked ? checked.dataset.menu : null;
    const existing = existingMenuFor(loggedInEmployee, d);
    if(menuId){
      if(existing !== menuId){
        if(!state.orders[d]) state.orders[d] = {};
        state.orders[d][loggedInEmployee] = menuId;
        ordered++;
      }
    } else if(existing){
      delete state.orders[d][loggedInEmployee];
      cancelled++;
    }
  });
  saveData();
  const parts = [];
  if(ordered) parts.push(`${ordered}件を発注しました`);
  if(cancelled) parts.push(`${cancelled}件を取り消しました`);
  batchMessage = parts.length ? parts.join(" / ") : "変更はありませんでした";
  render();
}

/* ===================== 管理タブ ===================== */
// 管理タブは発注タブと共通の loggedInEmployee を使用する。
// 未ログインならログインを促し、ログイン済みでも管理者権限（isAdmin）がなければアクセスさせない。

function renderAdminAccessScreen(){
  const emp = state.employees.find(x=>x.id===loggedInEmployee);
  if(emp && !emp.isAdmin){
    app.innerHTML = `
      <div class="card">
        <h2>管理タブ</h2>
        <div class="status-box status-lock">現在ログイン中の「${emp.name}」は管理者権限を持っていません。</div>
        <div class="hint">管理者権限のある社員CDでログインし直してください。</div>
        <button class="secondary" id="switchAccountBtn">ログアウトして別のアカウントでログイン</button>
      </div>
    `;
    document.getElementById("switchAccountBtn").onclick = ()=>{
      loggedInEmployee = ""; loginError = ""; render();
    };
    return;
  }
  // 未ログインの場合はここで直接ログインできるようにする
  app.innerHTML = `
    <div class="card">
      <h2>管理タブ</h2>
      <div class="hint">管理者権限のある社員CDでログインしてください。一度ログインすれば、発注タブ・管理タブの両方でそのまま利用できます。</div>
      <label>社員CD</label>
      <input type="text" id="adminAccessCode" placeholder="例: 9999" autocomplete="off" inputmode="numeric">
      ${loginError ? `<div class="status-box status-lock">${loginError}</div>` : ""}
      <button class="primary" id="adminAccessBtn">ログイン</button>
    </div>
  `;
  const codeInput = document.getElementById("adminAccessCode");
  const doLogin = ()=>{
    attemptLogin(codeInput.value);
    render();
  };
  document.getElementById("adminAccessBtn").onclick = doLogin;
  codeInput.onkeydown = (e)=>{ if(e.key === "Enter") doLogin(); };
  codeInput.focus();
}

function renderAdminTab(){
  const adminEmp = state.employees.find(x=>x.id===loggedInEmployee && x.isAdmin);
  if(!adminEmp){
    renderAdminAccessScreen();
    return;
  }

  app.innerHTML = `
    <div class="card">
      <div class="row" style="align-items:center;">
        <div>
          <div class="hint" style="margin:0;">ログイン中（管理者）</div>
          <div style="font-size:16px;font-weight:bold;">${adminEmp.name}（社員CD: ${adminEmp.code}）</div>
        </div>
        <button class="secondary" id="adminLogoutBtn" style="flex:0 0 auto;">ログアウト</button>
      </div>
    </div>
    <div class="subtabs" id="adminSubtabs">
      <button data-sub="employees">対象者リスト</button>
      <button data-sub="menu">メニュー管理</button>
      <button data-sub="deadline">締切設定</button>
      <button data-sub="summary">発注集計・発注書</button>
      <button data-sub="receipt">受取確認リスト</button>
    </div>
    <div id="adminContent"></div>
  `;
  document.getElementById("adminLogoutBtn").onclick = ()=>{
    loggedInEmployee = ""; loginError = ""; render();
  };
  [...document.getElementById("adminSubtabs").children].forEach(b=>{
    b.classList.toggle("active", b.dataset.sub===currentAdminSub);
    b.onclick = ()=>{ currentAdminSub = b.dataset.sub; renderAdminTab(); };
  });
  const content = document.getElementById("adminContent");
  if(currentAdminSub==="employees") renderEmployeesAdmin(content);
  else if(currentAdminSub==="menu") renderMenuAdmin(content);
  else if(currentAdminSub==="deadline") renderDeadlineAdmin(content);
  else if(currentAdminSub==="summary") renderSummaryAdmin(content);
  else if(currentAdminSub==="receipt") renderReceiptAdmin(content);
}

/* --- 対象者リスト管理 --- */
function renderEmployeesAdmin(container){
  container.innerHTML = `
    <div class="card">
      <h2>対象者を追加</h2>
      <div class="row">
        <input type="text" id="newEmpCode" placeholder="社員CD">
        <input type="text" id="newEmpName" placeholder="氏名">
        <input type="text" id="newEmpDept" placeholder="部署">
        <label style="display:flex;align-items:center;gap:4px;flex:0 0 auto;min-width:auto;margin:0;">
          <input type="checkbox" id="newEmpIsAdmin"> 管理者
        </label>
        <button class="secondary" id="addEmpBtn" style="flex:0 0 auto;">追加</button>
      </div>
      <div class="hint">社員CDは発注画面・管理タブ共通のログインIDです。重複しない値を設定してください。「管理者」にチェックすると、その社員CDで管理タブにログインできるようになります。</div>
    </div>
    <div class="card">
      <h2>CSV一括取込・出力</h2>
      <div class="hint">CSV形式: 社員CD,氏名,部署（1行目はヘッダーでも可）。CSV取込では管理者権限は付与されません（一覧から個別に設定してください）。</div>
      <input type="file" id="csvInput" accept=".csv" style="margin-top:8px;">
      <div class="row" style="margin-top:10px;">
        <button class="secondary" id="csvExportBtn">CSVで出力</button>
      </div>
    </div>
    <div class="card">
      <h2>対象者一覧（${state.employees.length}名）</h2>
      <table>
        <tr><th>社員CD</th><th>氏名</th><th>部署</th><th>管理者</th><th class="no-print">操作</th></tr>
        ${state.employees.map(e=>`
          <tr>
            <td><input type="text" data-field="code" data-id="${e.id}" value="${e.code||""}"></td>
            <td><input type="text" data-field="name" data-id="${e.id}" value="${e.name}"></td>
            <td><input type="text" data-field="dept" data-id="${e.id}" value="${e.dept}"></td>
            <td style="text-align:center;"><input type="checkbox" class="adminCheckbox" data-id="${e.id}" ${e.isAdmin?"checked":""}></td>
            <td class="no-print"><button class="danger" data-del="${e.id}">削除</button></td>
          </tr>`).join("")}
      </table>
    </div>
  `;
  container.querySelector("#addEmpBtn").onclick = ()=>{
    const code = container.querySelector("#newEmpCode").value.trim();
    const name = container.querySelector("#newEmpName").value.trim();
    const dept = container.querySelector("#newEmpDept").value.trim();
    const isAdmin = container.querySelector("#newEmpIsAdmin").checked;
    if(!name || !code) { alert("社員CDと氏名は必須です"); return; }
    if(state.employees.some(e=>e.code === code)){ alert("その社員CDは既に使用されています"); return; }
    state.employees.push({id:uid("e"), code, name, dept, isAdmin});
    saveData(); renderAdminTab();
  };
  container.querySelectorAll("input[data-field]").forEach(inp=>{
    inp.onchange = ()=>{
      if(inp.dataset.field === "code"){
        const dup = state.employees.some(e=>e.id!==inp.dataset.id && e.code===inp.value.trim());
        if(dup){ alert("その社員CDは既に使用されています"); renderAdminTab(); return; }
      }
      const emp = state.employees.find(x=>x.id===inp.dataset.id);
      if(emp) emp[inp.dataset.field] = inp.value;
      saveData();
    };
  });
  container.querySelectorAll(".adminCheckbox").forEach(cb=>{
    cb.onchange = ()=>{
      const emp = state.employees.find(x=>x.id===cb.dataset.id);
      if(!emp) return;
      if(!cb.checked){
        const otherAdmins = state.employees.filter(e=>e.isAdmin && e.id!==emp.id).length;
        if(otherAdmins === 0){
          alert("最後の管理者アカウントの権限は外せません。先に別の管理者を設定してください。");
          renderAdminTab();
          return;
        }
      }
      emp.isAdmin = cb.checked;
      saveData();
    };
  });
  container.querySelectorAll("[data-del]").forEach(btn=>{
    btn.onclick = ()=>{
      const emp = state.employees.find(x=>x.id===btn.dataset.del);
      if(emp && emp.isAdmin){
        const otherAdmins = state.employees.filter(e=>e.isAdmin && e.id!==emp.id).length;
        if(otherAdmins === 0){
          alert("最後の管理者アカウントは削除できません。先に別の管理者を設定してください。");
          return;
        }
      }
      if(!confirm("この対象者を削除しますか？")) return;
      state.employees = state.employees.filter(x=>x.id!==btn.dataset.del);
      saveData(); renderAdminTab();
    };
  });
  container.querySelector("#csvInput").onchange = (e)=>{
    const file = e.target.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = ()=>{
      const lines = reader.result.split(/\r?\n/).map(l=>l.trim()).filter(l=>l);
      let added = 0, skipped = 0;
      lines.forEach(line=>{
        const parts = line.split(",").map(p=>p.trim());
        if(parts[0] === "社員CD" || parts[0] === "氏名" || parts[0] === "code") return; // ヘッダー行スキップ
        const [code, name, dept] = parts;
        if(!code || !name) return;
        if(state.employees.some(x=>x.code===code)){ skipped++; return; }
        state.employees.push({id:uid("e"), code, name, dept:dept||"", isAdmin:false});
        added++;
      });
      saveData(); renderAdminTab();
      alert(`${added}件を取り込みました${skipped ? `（重複社員CD ${skipped}件はスキップ）` : ""}`);
    };
    reader.readAsText(file, "UTF-8");
  };
  container.querySelector("#csvExportBtn").onclick = ()=>{
    const csv = "社員CD,氏名,部署\n" + state.employees.map(e=>`${e.code||""},${e.name},${e.dept}`).join("\n");
    downloadFile("対象者リスト.csv", csv);
  };
}

      </div>
      <table style="margin-top:10px;">
        <tr><th>日付</th><th class="no-print">操作</th></tr>
        ${blocked.length ? blocked.map(d=>`
          <tr>
            <td>${fmtDateJP(d)}</td>
            <td class="no-print"><button class="danger" data-del-date="${d}">削除</button></td>
          </tr>`).join("") : `<tr><td colspan="2" class="hint">登録されている発注不可日はありません</td></tr>`}
      </table>
    </div>
  `;
  container.querySelector("#saveDlBtn").onclick = ()=>{
    state.deadline.daysBefore = Number(container.querySelector("#dlDays").value)||0;
    state.deadline.time = container.querySelector("#dlTime").value || "15:00";
    saveData();
    alert("締切設定を保存しました");
  };
  container.querySelector("#addBlockedDateBtn").onclick = ()=>{
    const val = container.querySelector("#newBlockedDate").value;
    if(!val) return;
    if(!state.blockedDates) state.blockedDates = [];
    if(!state.blockedDates.includes(val)) state.blockedDates.push(val);
    saveData();
    renderAdminTab();
  };
  container.querySelectorAll("[data-del-date]").forEach(btn=>{
    btn.onclick = ()=>{
      state.blockedDates = (state.blockedDates||[]).filter(d=>d!==btn.dataset.delDate);
      saveData();
      renderAdminTab();
    };
  });
}

/* --- 発注集計・発注書 --- */
let summaryDate = todayStr();

function renderSummaryAdmin(container){
  const dayOrders = state.orders[summaryDate] || {};
  const rows = Object.entries(dayOrders).map(([empId, menuId])=>{
    const emp = state.employees.find(e=>e.id===empId);
    const menu = state.menu.find(m=>m.id===menuId);
    return {emp, menu};
  }).filter(r=>r.emp); // 削除済み社員は除外

  const countsByMenu = {};
  rows.forEach(r=>{
    if(!r.menu) return;
    countsByMenu[r.menu.id] = (countsByMenu[r.menu.id]||0) + 1;
  });

  container.innerHTML = `
    <div class="card no-print">
      <h2>集計対象日</h2>
      <input type="date" id="summaryDateInput" value="${summaryDate}">
    </div>
    <div class="card" id="printArea">
      <h2>発注集計（業者発注書）— ${fmtDateJP(summaryDate)}</h2>
      <table>
        <tr><th>メニュー</th><th>数量</th><th>単価</th><th>小計</th></tr>
        ${state.menu.map(m=>`
          <tr>
            <td>${m.name}</td>
            <td>${countsByMenu[m.id]||0}</td>
            <td>¥${m.price}</td>
            <td>¥${(countsByMenu[m.id]||0)*m.price}</td>
          </tr>`).join("")}
        <tr class="total-row">
          <td>合計</td>
          <td>${rows.length}</td>
          <td></td>
          <td>¥${rows.reduce((s,r)=>s + (r.menu?r.menu.price:0),0)}</td>
        </tr>
      </table>
      <h2 style="margin-top:20px;">発注者一覧</h2>
      <table>
        <tr><th>氏名</th><th>部署</th><th>メニュー</th></tr>
        ${rows.map(r=>`<tr><td>${r.emp.name}</td><td>${r.emp.dept}</td><td>${r.menu?r.menu.name:"（削除されたメニュー）"}</td></tr>`).join("")}

    </div>
    <div class="no-print" style="margin-top:10px;">
      <button class="secondary" id="printSummaryBtn">印刷</button>
      <button class="secondary" id="csvSummaryBtn">CSV出力</button>
    </div>
  `;
  container.querySelector("#summaryDateInput").onchange = (e)=>{ summaryDate = e.target.value; renderAdminTab(); };
  container.querySelector("#printSummaryBtn").onclick = ()=> window.print();
  container.querySelector("#csvSummaryBtn").onclick = ()=>{
    let csv = "氏名,部署,メニュー\n" + rows.map(r=>`${r.emp.name},${r.emp.dept},${r.menu?r.menu.name:""}`).join("\n");
    downloadFile(`発注一覧_${summaryDate}.csv`, csv);
  };
}

/* ===================== 共通ヘルパー ===================== */
function downloadFile(filename, content){
  const blob = new Blob(["﻿"+content], {type:"text/csv;charset=utf-8"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

/* ===================== 時計 ===================== */
function updateClock(){
  const now = new Date();
  document.getElementById("clockDisplay").textContent =
    `${now.getFullYear()}/${now.getMonth()+1}/${now.getDate()} ${String(now.getHours()).padStart(2,"0")}:${String(now.getMinutes()).padStart(2,"0")}`;
}
updateClock();
setInterval(updateClock, 30000);

/* ===================== 初期表示 ===================== */
render();
